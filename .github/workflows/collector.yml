name: Collector build and smoke checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build DatasetHub.sln --configuration Release
      - shell: pwsh
        run: |
          ./scripts/Local-SolutionChanges.ps1 -Mode Hide
          if (!((git ls-files -v -- DatasetHub.sln) -match '^S ')) { throw 'Solution local-hide check failed.' }
          ./scripts/Local-SolutionChanges.ps1 -Mode Show
          if ((git ls-files -v -- DatasetHub.sln) -match '^S ') { throw 'Solution local-show check failed.' }
      - shell: pwsh
        run: |
          $folder = Join-Path $PWD 'run/Release'
          foreach ($item in @('DatasetHub.Desktop.exe', 'DatasetHub.Collector.dll', 'scripts/New-MockLogs.ps1')) {
            if (!(Test-Path (Join-Path $folder $item))) { throw "Build output missing: $item" }
          }
          if (!(Test-Path 'config/collector.local-example.json')) { throw 'Project config missing.' }
      - name: WPF and Equipment integration tests including UNC access
        shell: pwsh
        run: |
          $sharePath = Join-Path $env:RUNNER_TEMP 'DatasetHubShare'
          New-Item -ItemType Directory -Force $sharePath | Out-Null
          Set-Content (Join-Path $sharePath 'probe.txt') 'read probe'
          New-SmbShare -Name DatasetHubTest -Path $sharePath -FullAccess "$env:USERDOMAIN\$env:USERNAME" | Out-Null
          try {
            $env:DATASETHUB_TEST_SHARE = '\\localhost\DatasetHubTest'
            dotnet run --project tests/DatasetHub.DesktopTests --configuration Release
            if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed.' }
          } finally {
            Remove-SmbShare -Name DatasetHubTest -Force
          }
      - name: Independent watchdog heartbeat checks
        shell: pwsh
        run: |
          $healthRoot = Join-Path $env:LOCALAPPDATA 'DatasetHub/health'
          New-Item -ItemType Directory -Force $healthRoot | Out-Null
          $healthPath = Join-Path $healthRoot "$PID.json"
          try {
            @{ ProcessId=$PID; StartedUtc=(Get-Process -Id $PID).StartTime.ToUniversalTime(); HeartbeatUtc=[datetime]::UtcNow; UiHeartbeatUtc=[datetime]::UtcNow.AddMinutes(-5); State='Running' } | ConvertTo-Json | Set-Content $healthPath
            $output = & ./scripts/Watch-DatasetHub.ps1 -CollectorProcessId $PID -Once 6>&1 | Out-String
            if ($output -notmatch 'UI heartbeat stale') { throw 'UI stall was not detected.' }
            @{ ProcessId=$PID; StartedUtc=(Get-Process -Id $PID).StartTime.ToUniversalTime().AddDays(-1); HeartbeatUtc=[datetime]::UtcNow; UiHeartbeatUtc=[datetime]::UtcNow; State='Running' } | ConvertTo-Json | Set-Content $healthPath
            $output = & ./scripts/Watch-DatasetHub.ps1 -CollectorProcessId $PID -Once 6>&1 | Out-String
            if ($output -notmatch 'identity mismatch') { throw 'PID identity protection failed.' }
            Write-Host 'PASS independent watchdog UI stall and PID reuse guards'
          } finally { Remove-Item $healthPath -ErrorAction SilentlyContinue }
      - run: dotnet run --project tests/DatasetHub.SmokeTests --configuration Release
      - shell: pwsh
        run: |
          ./scripts/New-MockLogs.ps1
          dotnet run --project src/DatasetHub.Collector --configuration Release -- config/collector.local-example.json 20261026 20261026
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/DatasetHub.Collector --configuration Release -- config/collector.local-example.json 20261026 20261026
          exit $LASTEXITCODE
      - shell: pwsh
        run: |
          ./scripts/Build-WindowsBundle.ps1
          $bundle = Join-Path $PWD 'artifacts/DatasetHub-Windows-x64'
          & (Join-Path $bundle 'scripts/New-MockLogs.ps1')
          & (Join-Path $bundle 'console/DatasetHub.Collector.exe') (Join-Path $bundle 'config/collector.local-example.json') 20261026 20261026
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $bundle 'console/DatasetHub.Collector.exe') (Join-Path $bundle 'config/collector.local-example.json') 20261026 20261026
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path $bundle -DestinationPath 'artifacts/DatasetHub-Windows-x64.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: DatasetHub-Windows-x64
          path: artifacts/DatasetHub-Windows-x64.zip
          retention-days: 7
